services:
  - type: web
    runtime: node
    name: relay-helpdesk
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.4.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@relay.example
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: relay-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
